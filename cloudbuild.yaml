# Push to main -> tests -> build -> deploy. Run by a Cloud Build trigger
# (see SETUP.md). Nothing here needs to be run by hand.
#
# Order matters: both Cloud Run services must exist before Firebase Hosting
# deploys, because Hosting's rewrites point at them.

substitutions:
  _REGION: australia-southeast1
  _REPO: second-order
  _WEB_SERVICE: so-web
  _INGEST_SERVICE: so-ingest
  _FIREBASE_TOOLS: 15.30.2
  _PUBLIC_URL: "" # optional, e.g. https://2ndorder.live (see SETUP.md troubleshooting)

options:
  # Required when the trigger runs as a user-chosen service account.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s

steps:
  # 1. Tests, and a check that the committed participant runtime matches its
  #    source. Any failure stops the deploy; production is untouched.
  - id: test
    name: node:22
    entrypoint: bash
    args: ["-c", "npm ci --no-audit --no-fund && npm test && node scripts/check-runtime.mjs"]

  # 2. Make sure the image registry exists (only does anything on the first run).
  - id: ensure-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_REPO} --location=${_REGION} >/dev/null 2>&1 \
          || gcloud artifacts repositories create ${_REPO} --repository-format=docker \
               --location=${_REGION} --description="Second Order images"
    waitFor: ["-"]

  # 3. Build and push both images (repo root is the build context).
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/web/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA", "."]
    waitFor: ["-"]
  - id: build-ingest
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/ingest/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ingest:$COMMIT_SHA", "."]
    waitFor: ["-"]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA"]
    waitFor: ["build-web", "ensure-registry", "test"]
  - id: push-ingest
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ingest:$COMMIT_SHA"]
    waitFor: ["build-ingest", "ensure-registry", "test"]

  # 4. Deploy the ingest service. Secrets are attached only if they exist, so
  #    the first deploy works before the database is set up.
  - id: deploy-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRETS=""
        for s in DATABASE_URL PROLIFIC_TOKEN; do
          if gcloud secrets describe $$s >/dev/null 2>&1; then SECRETS="$$SECRETS,$$s=$$s:latest"; fi
        done
        FLAG=""; [ -n "$$SECRETS" ] && FLAG="--set-secrets=$${SECRETS#,}"
        gcloud run deploy ${_INGEST_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ingest:$COMMIT_SHA \
          --region=${_REGION} --allow-unauthenticated \
          --min-instances=0 --max-instances=10 --memory=512Mi --cpu=1 \
          --set-env-vars=GIT_COMMIT=$SHORT_SHA \
          $$FLAG
    waitFor: ["push-ingest"]

  # 5. Deploy the researcher app (UI, API, MCP endpoint).
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRETS=""
        for s in DATABASE_URL PROLIFIC_TOKEN BOOTSTRAP_TOKEN; do
          if gcloud secrets describe $$s >/dev/null 2>&1; then SECRETS="$$SECRETS,$$s=$$s:latest"; fi
        done
        FLAG=""; [ -n "$$SECRETS" ] && FLAG="--set-secrets=$${SECRETS#,}"
        ENVS="GIT_COMMIT=$SHORT_SHA,DEPLOYED_AT=$$(date -u +%Y-%m-%dT%H:%MZ)"
        [ -n "${_PUBLIC_URL}" ] && ENVS="$$ENVS,PUBLIC_URL=${_PUBLIC_URL}"
        gcloud run deploy ${_WEB_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$COMMIT_SHA \
          --region=${_REGION} --allow-unauthenticated \
          --min-instances=0 --max-instances=3 --memory=1Gi --cpu=1 --timeout=300 \
          --set-env-vars=$$ENVS \
          $$FLAG
    waitFor: ["push-web"]

  # 6. Deploy Firebase Hosting: the participant runtime plus routes to both services.
  - id: deploy-hosting
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npx --yes firebase-tools@${_FIREBASE_TOOLS} deploy --only hosting \
          --project=$PROJECT_ID --non-interactive --message="$SHORT_SHA"
    waitFor: ["deploy-web", "deploy-ingest"]
