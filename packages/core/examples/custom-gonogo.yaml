spec: "0.1"
study:
  slug: custom-gonogo-demo
  title: Go/no-go written as custom code
  approved_protocol: "Umbrella approval for anonymous online tasks (edit to your protocol number)"

blocks:
  consent: consent@1
  gonogo: custom-jspsych@1
  debrief: debrief@1

sequence:
  - use: consent
    params:
      text: |
        A short demonstration task. It takes about 2 minutes and your responses are anonymous.

  - use: gonogo
    params:
      description: >-
        Go/no-go: press the space bar for a green circle (go), do nothing for a red circle (no-go).
        20 trials, 75% go, 1 s response window.
      expected_rows: 20
      est_minutes: 1.5
      params: { n_trials: 20, go_prop: 0.75, window_ms: 1000 }
      columns:
        trial: integer
        go: boolean
        responded: boolean
        correct: boolean
        rt: number
      code: |
        const P = api.params;
        const nGo = Math.round(P.n_trials * P.go_prop);
        const kinds = Array.from({ length: P.n_trials }, (_, i) => i < nGo);
        for (let i = kinds.length - 1; i > 0; i--) {
          const j = Math.floor(api.rng() * (i + 1));
          [kinds[i], kinds[j]] = [kinds[j], kinds[i]];
        }
        const circle = (c) => `<div style="width:120px;height:120px;border-radius:50%;background:${c};margin:auto"></div>`;
        const jsPsych = initJsPsych({ display_element: api.root, on_finish: () => api.done() });
        const timeline = [{
          type: jsPsychHtmlButtonResponse,
          stimulus: "<p>Press <b>SPACE</b> for a <b style='color:#15803d'>green</b> circle. Do nothing for a <b style='color:#b91c1c'>red</b> one.</p>",
          choices: ["Start"],
        }];
        kinds.forEach((go, i) => {
          timeline.push({ type: jsPsychHtmlKeyboardResponse, stimulus: "<div style='font-size:40px'>+</div>", choices: "NO_KEYS", trial_duration: 400 });
          timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: circle(go ? "#16a34a" : "#dc2626"),
            choices: [" "],
            trial_duration: P.window_ms,
            on_finish: (d) => {
              const responded = d.response !== null;
              api.record({ trial: i, go, responded, correct: responded === go, rt: responded ? Math.round(d.rt) : null });
            },
          });
        });
        jsPsych.run(timeline);

  - use: debrief
    params:
      text: Thanks, that's the end of the demo.

measures:
  go_rt: { fn: mean, of: gonogo.rt, filter: "go == true and responded == true" }
  commission_rate: { fn: mean, of: gonogo.responded, filter: "go == false" }
  accuracy: { fn: mean, of: gonogo.correct }

exclusions:
  - { id: low_accuracy, when: "accuracy < 0.6" }

recruitment:
  platform: link
  max_n: 20
  est_minutes: 2
