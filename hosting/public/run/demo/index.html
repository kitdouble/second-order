<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Order: runtime demo</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1c1917; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    pre { background: #f5f5f4; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Runtime demo</h1>
  <p>This static page stands in for a compiled study bundle. Pressing the button
     sends one fake trial to the ingest service, the same path real studies will use.</p>
  <button id="send">Send a test trial</button>
  <pre id="out">Not sent yet.</pre>

  <script>
    // Session ids are random here; real bundles get them from the platform.
    const sessionId = "demo_" + Math.random().toString(36).slice(2, 12);
    let trialIndex = 0;
    const out = document.getElementById("out");

    async function post(batch, attempt = 1) {
      try {
        const res = await fetch("/api/ingest/trials", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(batch),
        });
        return { status: res.status, body: await res.json() };
      } catch (err) {
        // Retry with backoff; the server ignores duplicates, so this is safe.
        if (attempt >= 4) throw err;
        await new Promise((r) => setTimeout(r, 500 * 2 ** attempt));
        return post(batch, attempt + 1);
      }
    }

    document.getElementById("send").addEventListener("click", async () => {
      const batch = {
        study_hash: "demo",
        session_id: sessionId,
        trials: [{ trial_index: trialIndex++, data: { rt: Math.round(performance.now()), demo: true } }],
      };
      out.textContent = "Sending...";
      try {
        const r = await post(batch);
        out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(r.body, null, 2);
      } catch (err) {
        out.textContent = "Failed after retries: " + err.message;
      }
    });
  </script>
</body>
</html>
